<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nagarmal Sheonarain - Entry Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #b8922a; --gold-light: #e8c96e; --dark: #1a1209;
      --cream: #fdf8ef; --text: #3a2e1a; --border: rgba(184,146,42,0.25); --white: #ffffff;
    }
    body { font-family: 'Jost', sans-serif; background: var(--cream); display: flex; justify-content: center; padding: 30px 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 750px; box-shadow: 0 10px 45px rgba(184,146,42,0.14); overflow: hidden; }
    .top-bar { height: 5px; background: linear-gradient(90deg, #b8922a, #e8c96e, #b8922a); }
    .header { padding: 25px; text-align: center; border-bottom: 1px solid var(--border); }
    .header-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--dark); }
    .form-body { padding: 25px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { margin-bottom: 5px; }
    .main-label { display: block; font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }

    input, select {
      width: 100%; padding: 0 12px; height: 42px; font-family: 'Jost', sans-serif; font-size: 14px; color: var(--text);
      background: var(--cream); border: 1px solid var(--border); border-radius: 5px; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--gold); background: var(--white); }
    select:disabled, input:disabled { opacity: 0.8; background-color: #f7f0dc; cursor: not-allowed; font-weight: 600; }
    .locked-badge { float: right; font-size: 10px; background: var(--gold); color: #fff; padding: 2px 6px; border-radius: 3px; }

    .section-title { margin: 25px 0 12px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .section-title h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--dark); }
    .counter { font-size: 13px; font-weight: 600; color: #fff; background: var(--gold); padding: 3px 10px; border-radius: 12px; }

    .barcode-row { display: flex; gap: 8px; }
    .btn-scan { background: var(--gold); color: #fff; border: none; border-radius: 5px; padding: 0 12px; font-weight: 600; cursor: pointer; font-family: 'Jost', sans-serif; height: 42px; white-space: nowrap; font-size: 13px; }
    .btn-scan:hover { background: #9a7820; }
    .btn-add { background: var(--dark); color: var(--gold-light); }
    .btn-add:hover { background: #2a1f0a; }

    #reader { width: 100%; border-radius: 5px; overflow: hidden; display: none; margin-top: 10px; border: 2px solid var(--gold); }
    .scan-hint { font-size: 13px; color: #c0392b; margin-top: 8px; display: none; font-weight: 500; }

    .bc-list { list-style: none; margin-top: 12px; max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 5px; }
    .bc-list:empty { display: none; }
    .bc-list li { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--border); }
    .bc-list li:last-child { border-bottom: none; }
    .bc-list .num { color: var(--gold); font-weight: 600; width: 32px; }
    .bc-list .code { flex: 1; font-weight: 500; word-break: break-all; }
    .bc-list button { border: none; background: none; color: #c0392b; font-size: 18px; cursor: pointer; padding: 0 6px; }
    .empty-msg { font-size: 13px; color: var(--text); opacity: 0.7; margin-top: 10px; }

    .btn-submit { width: 100%; height: 50px; margin-top: 20px; background: var(--dark); color: var(--gold-light); border: none; border-radius: 5px; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: #2a1f0a; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg { text-align: center; font-weight: 600; margin-bottom: 15px; font-size: 14px; }
    .loading { color: var(--gold); }
    .error { color: #c0392b; }
    .success { color: #2ecc71; display: none; padding: 10px; background: #eafaf1; border-radius: 5px; border: 1px solid #2ecc71; }

    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="card">
  <div class="top-bar"></div>
  <div class="header">
    <h1 class="header-title">Data Entry System</h1>
    <p style="color: var(--gold); font-size: 13px; margin-top: 5px;">Nagarmal Sheonarain Private Limited</p>
  </div>

  <div class="form-body">
    <div id="loadingMsg" class="status-msg loading">Fetching Data from Sheet... Please wait.</div>
    <div id="successMsg" class="status-msg success"></div>

    <!-- STEP 1: Pehle sab details bharein -->
    <div class="field" style="margin-bottom: 15px;">
      <label class="main-label">LOCATION <span id="lock-badge" class="locked-badge" style="display:none;">Auto-Locked</span></label>
      <select id="col_location">
        <option value="">Select Location</option>
        <option value="CK">CK</option>
        <option value="RC">RC</option>
        <option value="PT 1">PT 1</option>
        <option value="PT 2">PT 2</option>
        <option value="JM 2">JM 2</option>
        <option value="JM 3">JM 3</option>
        <option value="MUZ 2">MUZ 2</option>
        <option value="MUZ 3">MUZ 3</option>
        <option value="BGP">BGP</option>
        <option value="A3W">A3W</option>
        <option value="WH">WH</option>
      </select>
    </div>

    <div class="form-grid" id="dropdown-container"></div>

    <div class="field" style="margin-top: 15px;">
      <label class="main-label">COLOUR NAME</label>
      <input type="text" id="col_colour" placeholder="Type colour name..." />
    </div>

    <!-- STEP 2: Ab barcode add karte jayein -->
    <div class="section-title">
      <h2>Barcodes</h2>
      <span class="counter" id="counter">0 / 50</span>
    </div>

    <div class="barcode-row">
      <input type="text" id="col_0" placeholder="Scan or type barcode..." autocomplete="off" onkeydown="handleBarcodeEnter(event)" />
      <button type="button" class="btn-scan btn-add" onclick="addFromInput()">Add</button>
    </div>
    <div class="barcode-row" style="margin-top: 8px;">
      <button type="button" id="scanBtn" class="btn-scan" style="flex:1;" onclick="toggleScanner()">📷 Camera Scan</button>
      <button type="button" class="btn-scan" style="flex:1;" onclick="document.getElementById('barcodeFile').click()">🖼 Photo</button>
    </div>
    <input type="file" id="barcodeFile" accept="image/*" capture="environment" style="display:none" onchange="scanFromPhoto(this)" />
    <div id="scanHint" class="scan-hint"></div>
    <div id="reader"></div>

    <div id="emptyMsg" class="empty-msg">Abhi koi barcode add nahi hua.</div>
    <ul class="bc-list" id="bcList"></ul>

    <button class="btn-submit" id="submitBtn" onclick="submitForm()">Save</button>
  </div>
</div>

<script>
  // =====================================================
  //  YAHAN APPS SCRIPT WEB APP KA URL PASTE KAREIN
  // =====================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxSzlnLQ9LULaOkbBe9rYW5NYnifr6gQvzTfDXLKwyscmG7zWtlxro-m19IYOQAGzxQaw/exec";

  const MAX = 50;
  let rawData = [];
  let barcodes = [];
  let html5QrCode = null;
  let scanning = false;
  let lastScan = { text: "", time: 0 };

  const prefilledLocation = new URLSearchParams(window.location.search).get("loc") || "";

  const colNames = [
    "SUB SECTION", "SUB SECTION 2", "MAJOR CATEGORY",
    "PATTERN", "PATTERN 2",
    "FABRIC", "ADD STYLE", "CUT_FIT_STITCH_STYLE"
  ];

  // DATA sheet me har dropdown ka column header ke naam se dhoondha jata hai
  let colIdx = [];
  const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, "");

  window.onload = function() {
    document.getElementById("submitBtn").disabled = true;
    if (prefilledLocation) {
      const locSelect = document.getElementById("col_location");
      locSelect.value = prefilledLocation;
      if (locSelect.value === prefilledLocation) {
        locSelect.disabled = true;
        document.getElementById("lock-badge").style.display = "inline";
      }
    }
    renderList();
    loadData();
  };

  function loadData() {
    fetch(API_URL + "?action=getData")
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error || "Data nahi mila");
        initializeForm(res.data);
      })
      .catch(err => {
        const m = document.getElementById("loadingMsg");
        m.className = "status-msg error";
        m.innerText = "Data load nahi hua. Internet check karke page refresh karein. (" + err.message + ")";
      });
  }

  // ---------- BARCODE LIST ----------
  function showHint(msg) {
    const h = document.getElementById("scanHint");
    h.innerText = msg || "";
    h.style.display = msg ? "block" : "none";
  }

  function addBarcode(raw) {
    const code = String(raw || "").trim();
    if (!code) return false;
    if (barcodes.length >= MAX) { showHint("Maximum " + MAX + " barcode ho gaye. Pehle Save karein."); return false; }
    if (barcodes.includes(code)) { showHint(code + " pehle se list me hai."); return false; }
    barcodes.push(code);
    showHint("");
    if (navigator.vibrate) navigator.vibrate(80);
    renderList();
    if (barcodes.length >= MAX) stopScanner();
    return true;
  }

  function removeBarcode(i) {
    barcodes.splice(i, 1);
    renderList();
  }

  function renderList() {
    const ul = document.getElementById("bcList");
    ul.innerHTML = "";
    barcodes.forEach((code, i) => {
      const li = document.createElement("li");
      const num = document.createElement("span"); num.className = "num"; num.textContent = (i + 1) + ".";
      const txt = document.createElement("span"); txt.className = "code"; txt.textContent = code;
      const del = document.createElement("button"); del.type = "button"; del.textContent = "✕"; del.title = "Hatayein";
      del.onclick = () => removeBarcode(i);
      li.append(num, txt, del);
      ul.appendChild(li);
    });
    ul.scrollTop = ul.scrollHeight;
    document.getElementById("counter").innerText = barcodes.length + " / " + MAX;
    document.getElementById("emptyMsg").style.display = barcodes.length ? "none" : "block";
    const btn = document.getElementById("submitBtn");
    btn.innerText = barcodes.length ? "Save " + barcodes.length + " Barcode" + (barcodes.length > 1 ? "s" : "") : "Save";
    btn.disabled = barcodes.length === 0 || rawData.length === 0;
  }

  // Manual / physical scanner gun: Enter dabte hi barcode list me add
  function addFromInput() {
    const inp = document.getElementById("col_0");
    if (addBarcode(inp.value)) inp.value = "";
    inp.focus();
  }
  function handleBarcodeEnter(e) {
    if (e.key === "Enter") { e.preventDefault(); addFromInput(); }
  }

  // ---------- CAMERA (lagataar scan, har barcode list me add hota rahega) ----------
  function getScanner() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93, Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
        ],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
    }
    return html5QrCode;
  }

  function toggleScanner() { scanning ? stopScanner() : startScanner(); }

  function startScanner() {
    if (barcodes.length >= MAX) { showHint("Maximum " + MAX + " barcode ho gaye. Pehle Save karein."); return; }
    showHint("");
    document.getElementById("reader").style.display = "block";
    document.getElementById("scanBtn").innerText = "✖ Stop Camera";

    getScanner().start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 100 } },
      (text) => {
        const now = Date.now();
        // Wahi barcode 3 second tak dobara na pade
        if (text === lastScan.text && now - lastScan.time < 3000) return;
        lastScan = { text: text, time: now };
        addBarcode(text);
      },
      () => {}
    ).then(() => { scanning = true; })
     .catch(() => {
       scanning = false;
       document.getElementById("reader").style.display = "none";
       document.getElementById("scanBtn").innerText = "📷 Camera Scan";
       showHint("Camera nahi khula. Browser me is site ke liye Camera 'Allow' karein, ya '🖼 Photo' use karein.");
     });
  }

  function stopScanner() {
    if (!html5QrCode || !scanning) return Promise.resolve();
    return html5QrCode.stop().then(() => {
      scanning = false;
      document.getElementById("reader").style.display = "none";
      document.getElementById("scanBtn").innerText = "📷 Camera Scan";
    }).catch(() => { scanning = false; });
  }

  async function scanFromPhoto(input) {
    if (!input.files.length) return;
    showHint("Barcode padh rahe hain...");
    try {
      await stopScanner();
      const text = await getScanner().scanFile(input.files[0], false);
      addBarcode(text);
    } catch (e) {
      showHint("Barcode nahi mila. Tag ki photo paas se, seedhi aur saaf roshni me lein.");
    }
    input.value = "";
  }

  // ---------- DROPDOWNS ----------
  function initializeForm(data) {
    rawData = data;
    const header = data[0] || [];
    colIdx = colNames.map(n => header.findIndex(h => norm(h) === norm(n)));
    const missing = colNames.filter((n, i) => colIdx[i] < 0);
    if (missing.length) {
      const m = document.getElementById("loadingMsg");
      m.className = "status-msg error";
      m.innerText = "DATA sheet me ye column nahi mile: " + missing.join(", ") + ". Header row ke naam check karein.";
      return;
    }
    document.getElementById("loadingMsg").style.display = "none";

    const container = document.getElementById("dropdown-container");
    container.innerHTML = "";
    colNames.forEach((name, index) => {
      const fieldDiv = document.createElement("div");
      fieldDiv.className = "field";
      const label = document.createElement("label");
      label.className = "main-label";
      label.innerText = name;
      const select = document.createElement("select");
      select.id = "col_" + (index + 1);
      select.disabled = true;
      select.innerHTML = '<option value="">Select ' + name + '</option>';
      select.addEventListener("change", () => handleSelection(index + 1));
      fieldDiv.appendChild(label);
      fieldDiv.appendChild(select);
      container.appendChild(fieldDiv);
    });
    populateDropdown(1);
    renderList();
  }

  function handleSelection(colIndex) {
    for (let i = colIndex + 1; i <= colNames.length; i++) {
      const nextSelect = document.getElementById("col_" + i);
      nextSelect.innerHTML = '<option value="">Select ' + colNames[i - 1] + '</option>';
      nextSelect.disabled = true;
    }
    if (colIndex === 0) return;
    const currentVal = document.getElementById("col_" + colIndex).value;
    if (currentVal !== "" && colIndex < colNames.length) populateDropdown(colIndex + 1);
  }

  function populateDropdown(targetColIndex) {
    const filters = [];
    for (let i = 1; i < targetColIndex; i++) filters.push(document.getElementById("col_" + i).value.trim());

    const options = new Set();
    for (let r = 1; r < rawData.length; r++) {
      let isMatch = true;
      for (let f = 0; f < filters.length; f++) {
        if (filters[f] !== "" && String(rawData[r][colIdx[f]]).trim() !== filters[f]) { isMatch = false; break; }
      }
      if (isMatch) {
        const val = String(rawData[r][colIdx[targetColIndex - 1]]).trim();
        if (val !== "") options.add(val);
      }
    }

    const selectEl = document.getElementById("col_" + targetColIndex);
    selectEl.innerHTML = '<option value="">Select ' + colNames[targetColIndex - 1] + '</option>';
    if (options.size > 0) {
      selectEl.disabled = false;
      Array.from(options).sort().forEach(opt => {
        const o = document.createElement("option");
        o.value = opt; o.innerText = opt;
        selectEl.appendChild(o);
      });
    }
  }

  // ---------- SAVE ----------
  function submitForm() {
    const locSelect = document.getElementById("col_location");
    if (!locSelect.value) { alert("Please select a Location."); return; }
    if (barcodes.length === 0) { alert("Kam se kam 1 barcode add karein."); return; }

    // Pending text box me barcode chhoot na jaye
    const pending = document.getElementById("col_0").value.trim();
    if (pending && !barcodes.includes(pending) && barcodes.length < MAX) {
      if (confirm("Box me '" + pending + "' likha hai, ise bhi add karein?")) addBarcode(pending);
    }

    const common = [];
    for (let i = 1; i <= colNames.length; i++) common.push(document.getElementById("col_" + i).value.trim());
    const colour = document.getElementById("col_colour").value.trim();
    const loc = locSelect.value.trim();

    // Har barcode ke liye ek row: [Location, Barcode, 9 dropdowns, Colour]
    const rows = barcodes.map(code => [loc, code, ...common, colour]);
    const count = rows.length;

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Saving " + count + " barcodes...";
    btn.disabled = true;
    document.getElementById("successMsg").style.display = "none";

    // Content-Type set nahi karna (text/plain rehne do), warna CORS error aata hai
    fetch(API_URL, { method: "POST", body: JSON.stringify(rows) })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error || "Save nahi hua");

        stopScanner();
        barcodes = [];
        document.getElementById("col_0").value = "";
        document.getElementById("col_colour").value = "";
        handleSelection(0);
        populateDropdown(1);
        showHint("");

        const s = document.getElementById("successMsg");
        s.innerText = count + " barcode save ho gaye!";
        s.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
        setTimeout(() => { s.style.display = "none"; }, 4000);
      })
      .catch(err => { alert("Save nahi hua: " + err.message); })
      .finally(() => { renderList(); });
  }
</script>
</body>
</html>

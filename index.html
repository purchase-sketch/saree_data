<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nagarmal Sheonarain - Entry Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #b8922a; --gold-light: #e8c96e; --dark: #1a1209;
      --cream: #fdf8ef; --text: #3a2e1a; --border: rgba(184,146,42,0.25); --white: #ffffff;
    }
    body {
      font-family: 'Jost', sans-serif; background: var(--cream);
      display: flex; justify-content: center; padding: 30px 16px;
    }
    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; width: 100%; max-width: 750px;
      box-shadow: 0 10px 45px rgba(184,146,42,0.14); overflow: hidden;
    }
    .top-bar { height: 5px; background: linear-gradient(90deg, #b8922a, #e8c96e, #b8922a); }
    .header { padding: 25px; text-align: center; border-bottom: 1px solid var(--border); }
    .header-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--dark); }

    .form-body { padding: 25px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { margin-bottom: 5px; }

    .main-label { display: block; font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }

    input, select {
      width: 100%; padding: 0 12px; height: 42px;
      font-family: 'Jost', sans-serif; font-size: 14px; color: var(--text);
      background: var(--cream); border: 1px solid var(--border); border-radius: 5px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--gold); background: var(--white); }
    select:disabled, input:disabled { opacity: 0.8; background-color: #f7f0dc; cursor: not-allowed; font-weight: 600; }

    .locked-badge { float: right; font-size: 10px; background: var(--gold); color: #fff; padding: 2px 6px; border-radius: 3px; }

    .btn-submit {
      width: 100%; height: 50px; margin-top: 25px; background: var(--dark); color: var(--gold-light);
      border: none; border-radius: 5px; font-size: 14px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; transition: 0.2s;
    }
    .btn-submit:hover { background: #2a1f0a; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .barcode-row { display: flex; gap: 8px; }
    .btn-scan {
      background: var(--gold); color: #fff; border: none; border-radius: 5px;
      padding: 0 12px; font-weight: 600; cursor: pointer; font-family: 'Jost', sans-serif;
      height: 42px; white-space: nowrap; font-size: 13px;
    }
    .btn-scan:hover { background: #9a7820; }

    .status-msg { text-align: center; font-weight: 600; margin-bottom: 15px; font-size: 14px; }
    .loading { color: var(--gold); }
    .error { color: #c0392b; }
    .success { color: #2ecc71; display: none; padding: 10px; background: #eafaf1; border-radius: 5px; border: 1px solid #2ecc71; }

    #reader { width: 100%; border-radius: 5px; overflow: hidden; display: none; margin-top: 10px; border: 2px solid var(--gold); }
    .scan-hint { font-size: 12px; color: var(--text); margin-top: 6px; display: none; }

    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="card">
  <div class="top-bar"></div>
  <div class="header">
    <h1 class="header-title">Data Entry System</h1>
    <p style="color: var(--gold); font-size: 13px; margin-top: 5px;">Nagarmal Sheonarain Private Limited</p>
  </div>

  <div class="form-body">
    <div id="loadingMsg" class="status-msg loading">Fetching Data from Sheet... Please wait.</div>
    <div id="successMsg" class="status-msg success">Data Saved Successfully!</div>

    <div class="form-grid" style="margin-bottom: 15px;">
      <div class="field">
        <label class="main-label">LOCATION <span id="lock-badge" class="locked-badge" style="display:none;">Auto-Locked</span></label>
        <select id="col_location">
          <option value="">Select Location</option>
          <option value="CK">CK</option>
          <option value="RC">RC</option>
          <option value="PT 1">PT 1</option>
          <option value="PT 2">PT 2</option>
          <option value="JM 2">JM 2</option>
          <option value="JM 3">JM 3</option>
          <option value="MUZ 2">MUZ 2</option>
          <option value="MUZ 3">MUZ 3</option>
          <option value="BGP">BGP</option>
          <option value="A3W">A3W</option>
        </select>
      </div>

      <div class="field">
        <label class="main-label">BARCODE</label>
        <div class="barcode-row">
          <input type="text" id="col_0" placeholder="Scan or type barcode..." autocomplete="off"
                 onkeydown="handleBarcodeEnter(event)" />
          <button type="button" id="scanBtn" class="btn-scan" onclick="toggleScanner()">📷 Scan</button>
          <button type="button" class="btn-scan" onclick="document.getElementById('barcodeFile').click()">🖼 Photo</button>
        </div>
        <input type="file" id="barcodeFile" accept="image/*" capture="environment"
               style="display:none" onchange="scanFromPhoto(this)" />
        <div id="scanHint" class="scan-hint"></div>
        <div id="reader"></div>
      </div>
    </div>

    <div class="form-grid" id="dropdown-container"></div>

    <div class="form-grid" style="margin-top: 15px;">
      <div class="field" style="grid-column: 1 / -1;">
        <label class="main-label">COLOUR NAME</label>
        <input type="text" id="col_colour" placeholder="Type colour name..." />
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitForm()">Save to Search Sheet</button>
  </div>
</div>

<script>
  // =====================================================
  //  
  //  (https://script.google.com/macros/s/.../exec)
  // =====================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxSzlnLQ9LULaOkbBe9rYW5NYnifr6gQvzTfDXLKwyscmG7zWtlxro-m19IYOQAGzxQaw/exec";

  let rawData = [];
  let html5QrCode = null;
  let scanning = false;

  // Location link se: https://....github.io/repo/?loc=CK
  const prefilledLocation = new URLSearchParams(window.location.search).get("loc") || "";

  const colNames = [
    "SUB SECTION", "SUB SECTION 2", "MAJOR CATEGORY",
    "SUB MAJOR CATEGORY", "PATTERN", "PATTERN 2",
    "FABRIC", "ADD STYLE", "CUT_FIT_STITCH_STYLE"
  ];

  window.onload = function() {
    document.getElementById("submitBtn").disabled = true;

    if (prefilledLocation) {
      const locSelect = document.getElementById("col_location");
      locSelect.value = prefilledLocation;
      if (locSelect.value === prefilledLocation) {
        locSelect.disabled = true;
        document.getElementById("lock-badge").style.display = "inline";
      }
    }
    loadData();
  };

  function loadData() {
    fetch(API_URL + "?action=getData")
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error || "Data nahi mila");
        initializeForm(res.data);
      })
      .catch(err => {
        const m = document.getElementById("loadingMsg");
        m.className = "status-msg error";
        m.innerText = "Data load nahi hua. Internet check karke page refresh karein. (" + err.message + ")";
      });
  }

  // ---------- BARCODE ----------
  function getScanner() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
    }
    return html5QrCode;
  }

  function setBarcode(text) {
    document.getElementById("col_0").value = String(text).trim();
    const next = document.getElementById("col_1");
    if (next && !next.disabled) next.focus();
  }

  function showHint(msg) {
    const h = document.getElementById("scanHint");
    h.innerText = msg || "";
    h.style.display = msg ? "block" : "none";
  }

  // Physical scanner gun: Enter se form submit nahi hoga
  function handleBarcodeEnter(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      const next = document.getElementById("col_1");
      if (next && !next.disabled) next.focus();
    }
  }

  // Live camera scan
  function toggleScanner() {
    if (scanning) { stopScanner(); } else { startScanner(); }
  }

  function startScanner() {
    showHint("");
    document.getElementById("reader").style.display = "block";
    document.getElementById("scanBtn").innerText = "✖ Stop";

    const config = { fps: 10, qrbox: { width: 250, height: 100 } };

    getScanner().start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        setBarcode(decodedText);
        stopScanner();
      },
      () => {}
    ).then(() => {
      scanning = true;
    }).catch(() => {
      scanning = false;
      document.getElementById("reader").style.display = "none";
      document.getElementById("scanBtn").innerText = "📷 Scan";
      showHint("Camera nahi khula. Browser me is site ke liye Camera 'Allow' karein, ya '🖼 Photo' se tag ki photo lein.");
    });
  }

  function stopScanner() {
    if (!html5QrCode || !scanning) return;
    html5QrCode.stop().then(() => {
      scanning = false;
      document.getElementById("reader").style.display = "none";
      document.getElementById("scanBtn").innerText = "📷 Scan";
    }).catch(() => {
      scanning = false;
      document.getElementById("scanBtn").innerText = "📷 Scan";
    });
  }

  // Photo se scan (backup)
  async function scanFromPhoto(input) {
    if (!input.files.length) return;
    showHint("Barcode padh rahe hain...");
    try {
      if (scanning) await html5QrCode.stop().then(() => { scanning = false; });
      document.getElementById("scanBtn").innerText = "📷 Scan";
      const text = await getScanner().scanFile(input.files[0], false);
      setBarcode(text);
      showHint("");
    } catch (e) {
      showHint("Barcode nahi mila. Tag ki photo paas se, seedhi aur saaf roshni me lein.");
    }
    input.value = "";
  }

  // ---------- FORM LOGIC ----------
  function initializeForm(data) {
    rawData = data;
    document.getElementById("loadingMsg").style.display = "none";
    document.getElementById("submitBtn").disabled = false;

    const container = document.getElementById("dropdown-container");
    container.innerHTML = "";

    colNames.forEach((name, index) => {
      const fieldDiv = document.createElement("div");
      fieldDiv.className = "field";

      const label = document.createElement("label");
      label.className = "main-label";
      label.innerText = name;

      const select = document.createElement("select");
      select.id = "col_" + (index + 1);
      select.disabled = true;

      select.innerHTML = '<option value="">Select ' + name + '</option>';
      select.addEventListener("change", () => handleSelection(index + 1));

      fieldDiv.appendChild(label);
      fieldDiv.appendChild(select);
      container.appendChild(fieldDiv);
    });
    populateDropdown(1);

    document.getElementById("col_0").focus();
  }

  function handleSelection(colIndex) {
    for (let i = colIndex + 1; i <= colNames.length; i++) {
      const nextSelect = document.getElementById("col_" + i);
      nextSelect.innerHTML = '<option value="">Select ' + colNames[i - 1] + '</option>';
      nextSelect.disabled = true;
    }
    if (colIndex === 0) return;
    const currentVal = document.getElementById("col_" + colIndex).value;
    if (currentVal !== "" && colIndex < colNames.length) {
      populateDropdown(colIndex + 1);
    }
  }

  function populateDropdown(targetColIndex) {
    const filters = [];
    for (let i = 1; i < targetColIndex; i++) {
      filters.push(document.getElementById("col_" + i).value.trim());
    }

    const options = new Set();

    for (let r = 1; r < rawData.length; r++) {
      let isMatch = true;
      for (let f = 0; f < filters.length; f++) {
        if (filters[f] !== "" && String(rawData[r][f]).trim() !== filters[f]) {
          isMatch = false;
          break;
        }
      }
      if (isMatch) {
        const val = String(rawData[r][targetColIndex - 1]).trim();
        if (val !== "") options.add(val);
      }
    }

    const selectEl = document.getElementById("col_" + targetColIndex);
    selectEl.innerHTML = '<option value="">Select ' + colNames[targetColIndex - 1] + '</option>';

    if (options.size > 0) {
      selectEl.disabled = false;
      Array.from(options).sort().forEach(opt => {
        const optionEl = document.createElement("option");
        optionEl.value = opt;
        optionEl.innerText = opt;
        selectEl.appendChild(optionEl);
      });
    }
  }

  function submitForm() {
    const locSelect = document.getElementById("col_location");
    if (!locSelect.value) {
      alert("Please select a Location.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Saving Data...";
    btn.disabled = true;
    document.getElementById("successMsg").style.display = "none";

    const formData = [];
    formData.push(locSelect.value.trim());
    formData.push(document.getElementById("col_0").value.trim());
    for (let i = 1; i <= colNames.length; i++) {
      formData.push(document.getElementById("col_" + i).value.trim());
    }
    formData.push(document.getElementById("col_colour").value.trim());

    // Content-Type set nahi karna (text/plain rehne do), warna CORS error aata hai
    fetch(API_URL, { method: "POST", body: JSON.stringify(formData) })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error || "Save nahi hua");

        document.getElementById("successMsg").style.display = "block";
        document.getElementById("col_0").value = "";
        document.getElementById("col_colour").value = "";
        handleSelection(0);
        populateDropdown(1);
        document.getElementById("col_0").focus();
        setTimeout(() => { document.getElementById("successMsg").style.display = "none"; }, 3000);
      })
      .catch(err => {
        alert("Save nahi hua: " + err.message);
      })
      .finally(() => {
        btn.innerText = "Save to Search Sheet";
        btn.disabled = false;
      });
  }
</script>
</body>
</html>
